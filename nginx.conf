# ─────────────────────────────────────────────────────────────────────────────
#  bienestarconnataliaguecha.com — configuración de nginx
#
#  Objetivos (además de servir la SPA de Angular):
#   1. 404 reales: una ruta inexistente NO devuelve el app shell con 200.
#   2. Negociación de contenido markdown (acceptmarkdown.com) con `Vary: Accept`.
#   3. Páginas ancla (/about, /contact, /privacy) servidas como HTML estático.
#
#  Este archivo se copia a /etc/nginx/conf.d/default.conf, que ya vive dentro
#  del bloque `http { … }`; por eso los `map` pueden declararse aquí arriba.
#
#  ⚠ Las rutas de la SPA están enumeradas más abajo y deben mantenerse en
#    sincronía con src/app/app-routing.module.ts. Si se añade una ruta nueva al
#    router de Angular hay que añadirla aquí, o devolverá 404.
#    El test `npm run test:agents` verifica esa correspondencia.
# ─────────────────────────────────────────────────────────────────────────────

# ¿El cliente pidió markdown explícitamente? → "md" | ""
map $http_accept $prefers_markdown {
    default              "";
    "~*text/markdown"    "md";
}

# Cuerpo del 404: markdown para agentes y clientes CLI, HTML para navegadores.
map $http_accept $not_found_body {
    default          /404.md;
    "~*text/html"    /404.html;
}

# Canonical HTTP de cada variante markdown hacia su página HTML.
# Si el valor queda vacío, nginx no añade la cabecera.
map $uri $md_canonical_link {
    default        "";
    /index.md      '<https://bienestarconnataliaguecha.com/>; rel="canonical"';
    /about.md      '<https://bienestarconnataliaguecha.com/about>; rel="canonical"';
    /contact.md    '<https://bienestarconnataliaguecha.com/contact>; rel="canonical"';
    /privacy.md    '<https://bienestarconnataliaguecha.com/privacy>; rel="canonical"';
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css text/xml text/plain text/markdown
                  text/vnd.wap.wml application/javascript application/rss+xml;

    # Gzip. `gzip_vary` queda apagado porque cada location declara su propio
    # `Vary` completo; así ninguna respuesta lleva la cabecera duplicada.
    gzip on;
    gzip_vary off;
    gzip_types text/plain text/css text/markdown text/xml application/json
               application/ld+json application/javascript application/xml
               image/svg+xml;

    # ── 404 real, con cuerpo negociado ───────────────────────────────────────
    error_page 404 $not_found_body;

    location = /404.md {
        internal;
        types { text/markdown md; }
        add_header Vary "Accept, Accept-Encoding" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /404.html {
        internal;
        add_header Vary "Accept, Accept-Encoding" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # ── Portada: SPA + variante markdown ─────────────────────────────────────
    location = / {
        if ($prefers_markdown = "md") {
            rewrite ^ /index.md last;
        }
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Link '</index.md>; rel="alternate"; type="text/markdown"' always;
        try_files /index.html =404;
    }

    # ── Páginas ancla estáticas: /about, /contact, /privacy ──────────────────
    # Se declaran una a una (y no con una regex con captura) para que la
    # cabecera Link sea una cadena literal, sin depender de $1 tras try_files.
    location = /about {
        if ($prefers_markdown = "md") {
            rewrite ^ /about.md last;
        }
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Link '</about.md>; rel="alternate"; type="text/markdown"' always;
        try_files /about.html =404;
    }

    location = /contact {
        if ($prefers_markdown = "md") {
            rewrite ^ /contact.md last;
        }
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Link '</contact.md>; rel="alternate"; type="text/markdown"' always;
        try_files /contact.html =404;
    }

    location = /privacy {
        if ($prefers_markdown = "md") {
            rewrite ^ /privacy.md last;
        }
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Link '</privacy.md>; rel="alternate"; type="text/markdown"' always;
        try_files /privacy.html =404;
    }

    # Con barra final → sin barra final (una sola URL canónica).
    location = /about/   { return 301 /about; }
    location = /contact/ { return 301 /contact; }
    location = /privacy/ { return 301 /privacy; }

    # Alias en español de las páginas ancla.
    location = /sobre-mi   { return 301 /about; }
    location = /contacto   { return 301 /contact; }
    location = /privacidad { return 301 /privacy; }

    # ── Rutas de la SPA (ver src/app/app-routing.module.ts) ──────────────────
    location = /pago-resultado {
        add_header Vary "Accept-Encoding" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location ~ ^/producto/[^/]+/?$ {
        add_header Vary "Accept-Encoding" always;
        try_files /index.html =404;
    }

    # ── Variantes markdown accesibles por ruta directa ───────────────────────
    location ~ \.md$ {
        types { text/markdown md; }
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Link $md_canonical_link always;
        try_files $uri =404;
    }

    # ── Archivos legibles por máquina ────────────────────────────────────────
    location = /llms.txt {
        add_header Vary "Accept-Encoding" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        add_header Vary "Accept-Encoding" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Vary "Accept-Encoding" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Vary "Accept-Encoding" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ── Todo lo demás: archivo real o 404 real (nunca el app shell) ──────────
    location / {
        add_header Vary "Accept-Encoding" always;
        try_files $uri $uri/ =404;
    }
}
